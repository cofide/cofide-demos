# authMode has two states:
#   - "static": every route accepts only a pre-shared static secret, over
#     plain HTTP — the world before Cofide Connect. Unchanged behaviour.
#   - "mixed": both listeners always speak webPKI TLS (see the `tls` block
#     below), and every route accepts EITHER a pre-shared static secret OR
#     the equivalent SPIFFE-based credential (X.509-SVID mTLS for
#     bank-client; a JWT-SVID for bank-lambda/bank-fraud-checker; a
#     Credex-minted delegated JWT for bank-agent) — whichever the caller
#     currently presents. "mixed" is a superset of the old "spiffe" mode: a
#     route with no static key configured is effectively SPIFFE-only.
# Once bank-server is running in "mixed" mode, individual callers
# (bank-client, bank-lambda, bank-fraud-checker, bank-agent) can each switch
# between presenting a static key or a SPIFFE credential independently, with
# no further changes to bank-server or its Helm release. Flipping bank-server
# itself between "static" and "mixed" still requires a `helm upgrade`
# followed by a rollout restart, since the TLS cert volume and (if any SPIFFE
# ID below is set) the SPIFFE Workload API socket are mounted at pod start.
authMode: static

image:
  prefix: ko.local/
  tag: latest
  pullPolicy: Never

# Only used when authMode is "mixed", and only per-field: each of
# clientSpiffeId/lambdaSpiffeId/fraudCheckerSpiffeId is independently
# optional — set it once that caller has been migrated onto a SPIFFE
# credential, leave it empty to keep accepting only that caller's static key.
# Values must match the SPIFFE IDs registered for each workload in your trust
# domain — fraudCheckerSpiffeId's is registered manually against a SPIRE
# server co-located with bank-fraud-checker on its VM (see
# workloads/bank/README.md), the same "registration happens outside this
# repo" pattern as the other two. agentAuthorizedActor is different:
# bank-agent (an AgentCore Runtime workload) has no SPIFFE identity at all —
# it's the "sub" claim AWS puts in the identity JWT it presents to Credex
# (i.e. bank-agent's IAM execution role ARN, see terraform output
# bank_agent_execution_role_arn), which is what ends up in a delegated
# token's "act.sub" for bank-server to authorize.
spiffe:
  socketPath: unix:///spiffe-workload-api/spire-agent.sock
  clientSpiffeId: ""
  lambdaSpiffeId: ""
  fraudCheckerSpiffeId: ""
  agentAuthorizedActor: ""

# Used whenever the corresponding key is non-empty, in BOTH "static" and
# "mixed" modes — not just "static". Change these before deploying to a
# shared cluster.
staticAuth:
  clientApiKey: "changeme-client-key"
  webhookApiKey: "changeme-webhook-key"
  agentApiKey: "changeme-agent-key"
  fraudCheckApiKey: "changeme-fraud-check-key"

# Cofide Credex's OIDC discovery endpoint, used by bank-server to validate
# bank-agent's delegated tokens. Only used when authMode is "mixed" —
# distinct from bank-agent's own Credex integration, which is configured in
# workloads/bank/terraform/agentcore.tf, not here.
credex:
  discoveryUrl: ""

# The cert-manager-issued webPKI certificate bank-server presents on both
# listeners in "mixed" mode. Assumes a ClusterIssuer/Issuer already exists in
# the cluster (out of scope for this chart) — only referenced here by name.
tls:
  # Required when authMode is "mixed".
  issuerName: ""
  issuerKind: ClusterIssuer # or "Issuer" if issuerName is namespace-scoped
  # Required when authMode is "mixed". Every hostname a caller will reach
  # bank-server on over TLS must be listed here for hostname verification to
  # succeed — both the in-cluster name bank-client uses for the client
  # listener, and whichever public hostname/tunnel bank-lambda/
  # bank-fraud-checker/bank-agent use for the webhook listener (see
  # server.webhookServiceType and the README's tunnel setup).
  dnsNames: []
  duration: "2160h" # 90d
  renewBefore: "360h" # 15d
  certFile: /etc/bank-server/tls/tls.crt
  keyFile: /etc/bank-server/tls/tls.key

# OIDC sign-in, powering the dashboard's chat feature. Any OIDC-compliant
# IdP works here (Ory, Auth0, Okta, ...) — nothing below is IdP-specific.
# Required in both auth modes — signing in as a customer is orthogonal to
# the static/SPIFFE toggle for the bank-client/bank-agent -> bank-server
# hops. bank-client is registered as a public OAuth2 client (PKCE, no client
# secret) — one less static secret to manage, consistent with the rest of
# this demo.
oidc:
  discoveryUrl: ""
  clientId: ""
  redirectUrl: ""

# bank-agent runs on AWS Bedrock AgentCore, not in this cluster — this is
# just where bank-client sends chat questions. See workloads/bank/terraform.
bankAgent:
  invokeUrl: ""

server:
  clientApiPort: 8443
  # bank-lambda and bank-agent (both running in AWS) share this listener —
  # different routes (/webhook/transactions, /api/summary), different auth,
  # one port to expose. ClusterIP is enough for bank-client, which runs in
  # the same cluster and uses clientApiPort instead; set this to LoadBalancer
  # (a real cloud cluster) or NodePort (a local kind cluster fronted by a
  # tunnel — see the README) so bank-lambda/bank-agent can reach it.
  webhookPort: 8444
  webhookServiceType: ClusterIP
  # Only used when webhookServiceType is NodePort. Must be within the
  # cluster's NodePort range and match whatever's tunnelled to your host
  # (e.g. a kind extraPortMappings entry).
  webhookNodePort: ""

client:
  listenPort: 8080
  # ClusterIP + kubectl port-forward is enough for a local demo; set to
  # LoadBalancer to open the dashboard directly in a browser.
  serviceType: ClusterIP

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
