# Renders in both "static" and "mixed" modes: mixed mode's per-route dual
# auth needs these static keys available too, for whichever callers haven't
# yet migrated to a SPIFFE-based credential. Empty values are a legitimate
# "this mechanism disabled for this route" state in bank-server's Go code,
# not an error.
apiVersion: v1
kind: Secret
metadata:
  name: bank-server-auth
  labels:
    {{- include "bank.labels" . | nindent 4 }}
type: Opaque
stringData:
  STATIC_CLIENT_API_KEY: {{ .Values.staticAuth.clientApiKey | quote }}
  STATIC_WEBHOOK_API_KEY: {{ .Values.staticAuth.webhookApiKey | quote }}
  STATIC_AGENT_API_KEY: {{ .Values.staticAuth.agentApiKey | quote }}
  STATIC_FRAUD_CHECK_API_KEY: {{ .Values.staticAuth.fraudCheckApiKey | quote }}
---
{{- if or (eq .Values.authMode "static") (eq .Values.authMode "mixed") }}
# bank-client's session-signing key is deliberately not in here (or anywhere
# else Kubernetes- or Connect-managed): it's never presented to another
# party — bank-client only ever signs and verifies its own cookies — so
# there's no reason for it to be a long-lived, mounted credential at all.
# bank-client/main.go generates one in memory at startup instead when
# SESSION_SECRET isn't set (the only cost: existing sessions don't survive a
# restart, fine for a single-replica demo deployment).
#
# This Secret itself renders in both "static" and "mixed" modes: unlike the
# old "spiffe" mode (where bank-client always used mTLS, never a static key),
# "mixed" mode lets bank-client keep presenting its static key for as long as
# it hasn't been individually migrated onto a SPIFFE credential — deleting
# this the moment bank-server flips to "mixed" would break bank-client
# immediately, defeating the point of migrating one component at a time.
apiVersion: v1
kind: Secret
metadata:
  name: bank-client-auth
  labels:
    {{- include "bank.labels" . | nindent 4 }}
type: Opaque
data:
  STATIC_CLIENT_API_KEY: {{ .Values.staticAuth.clientApiKey | b64enc }}
{{- end }}
